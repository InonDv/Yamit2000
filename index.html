<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7dd3fc" />
    <title>Yamit 2000</title>
    <script type="module" crossorigin src="./assets/index-BHulvB-u.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DXGQZZRm.css">
  </head>
  <body>
    <div id="app"></div>
    <aside id="hud">
      <h1 dir="rtl">מצא והורד את כל המלשינים</h1>
      <p>W/S: move · A/D: aim</p>
      <p>Arrow keys / Mouse: camera</p>
      <p>Space: punch / pick up / throw</p>
      <strong id="status">Find a white chair!</strong>
    </aside>
    <div id="crosshair" aria-hidden="true">+</div>
    <div id="touch-controls" hidden>
      <div id="touch-look-zone" role="region" aria-label="Drag to rotate camera">
        <span>גרור למצלמה</span>
      </div>
      <div class="touch-dpad" aria-label="Movement controls">
        <button class="touch-up" data-touch-key="KeyW" aria-label="Move forward">▲</button>
        <button class="touch-left" data-touch-key="KeyA" aria-label="Aim left">◀</button>
        <button class="touch-right" data-touch-key="KeyD" aria-label="Aim right">▶</button>
        <button class="touch-down" data-touch-key="KeyS" aria-label="Move backward">▼</button>
      </div>
      <button id="touch-action" data-touch-key="Space" aria-label="תפוס">תפוס</button>
    </div>
    <div id="victory-screen" hidden>
      <section class="victory-card" dir="rtl" aria-labelledby="victory-title">
        <h2 id="victory-title">ברכות, הורדת את כל המלשינים!</h2>
        <button id="restart-game" type="button">התחל משחק חדש</button>
      </section>
    </div>
  </body>
</html>
